# Railway backend (set Root Directory = repository root or folder with this file)

[build]
buildCommand = "go build -o bin/server ./cmd/service"

[deploy]
startCommand = "./bin/server"
# Healthcheck probes PORT (Railway-injected). Do not set APP_HTTP_PORT in Variables.
healthcheckPath = "/health"
healthcheckTimeout = 300
restartPolicyType = "ON_FAILURE"
